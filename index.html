<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>RushPulse — AEPi Recruitment CRM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%235b52f0'/%3E%3Cstop offset='55%25' stop-color='%239333ea'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Cpath d='M5 22h6l3-12 5 22 4-16 2.5 6h11.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#0a0a10; --panel:#15151d; --panel2:#191922; --card:#1c1c26;
  --border:#2b2b38; --border-hover:#40405433; --text:#f5f5f8; --dim:#a3a3b0; --dimmer:#71718a;
  --indigo:#5b52f0; --indigo2:#8b7fff; --violet:#9333ea; --pink:#ec4899; --cyan:#22d3ee;
  --green:#10b981; --amber:#f59e0b; --red:#f4426a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(155deg, #120f2c 0%, #211049 20%, #3a1268 38%, #5c1370 54%, #74206f 66%, #421252 80%, #150c26 100%);
  background-attachment:fixed;
}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#3a3a4a;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#4c4c62;}
button{font-family:inherit;}
a{color:inherit;}
.hidden{display:none !important;}

/* app shell: stacked on mobile, sidebar + content on desktop */
#app-shell{display:flex;flex-direction:column;min-height:100vh;}
@media(min-width:900px){#app-shell{flex-direction:row;}}

/* sidebar (the "control panel") */
#sidebar{position:sticky;top:0;z-index:40;background:rgba(12,12,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(147,112,255,.14);}
.sidebar-inner{padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
@media(min-width:900px){
  #sidebar{width:232px;flex:0 0 232px;height:100vh;position:sticky;top:0;border-bottom:none;border-right:1px solid rgba(147,112,255,.14);background:linear-gradient(180deg, rgba(91,82,240,.10), rgba(10,10,16,0) 30%), rgba(12,12,18,.7);}
  .sidebar-inner{flex-direction:column;align-items:stretch;height:100%;padding:20px 15px;gap:0;flex-wrap:nowrap;}
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--indigo),var(--violet) 55%,var(--pink));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 18px -4px rgba(147,51,234,.65);}
.brand-logo svg{width:19px;height:19px;display:block;}
.brand-name{font-weight:700;line-height:1.15;font-size:16px;background:linear-gradient(90deg,#c9c4ff,#ffb7e0);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--dimmer);line-height:1.2;}
@media(min-width:900px){.brand{margin-bottom:22px;}}

.tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;overflow-x:auto;order:3;flex:1 1 100%;}
.tab-btn{border:none;background:transparent;color:var(--dim);font-weight:500;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s;}
.tab-btn.active{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 3px 14px -3px rgba(147,51,234,.7);}
.tab-btn:not(.active):hover{color:var(--text);background:rgba(255,255,255,.05);}
@media(min-width:900px){
  .tabs{flex-direction:column;background:none;padding:0;gap:3px;order:0;overflow-x:visible;}
  .tab-btn{text-align:left;padding:10px 12px;width:100%;}
}

.header-actions{display:flex;align-items:center;gap:8px;order:2;margin-left:auto;}
@media(min-width:900px){
  .header-actions{flex-direction:column;align-items:stretch;margin-left:0;margin-top:auto;padding-top:18px;order:0;gap:8px;}
  .header-actions select{width:100%;}
}

/* buttons & inputs */
.btn{border:none;border-radius:10px;font-weight:500;font-size:13px;padding:8px 14px;cursor:pointer;transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 3px 14px -4px rgba(147,51,234,.55);}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 5px 18px -3px rgba(147,51,234,.75);transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,.09);border-color:var(--indigo2);}
.btn-danger{background:rgba(244,66,106,.15);color:#ff9db4;}
.btn-danger:hover{background:rgba(244,66,106,.25);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-xs{padding:2px 4px;font-size:11px;background:none;border:none;color:var(--dimmer);cursor:pointer;}
.btn-xs:hover{color:var(--text);}
.input,select,textarea{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;transition:.15s;}
.input:focus,select:focus,textarea:focus{border-color:var(--indigo2);box-shadow:0 0 0 3px rgba(139,127,255,.25);}
textarea{resize:vertical;min-height:44px;}
.field{display:block;margin-bottom:11px;}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:4px;}

/* badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;background:rgba(255,255,255,.08);color:#d3d3de;}
.badge-indigo{background:rgba(139,127,255,.18);color:#c3bbff;}
.badge-green{background:rgba(16,185,129,.18);color:#7cf2c4;}
.badge-amber{background:rgba(245,158,11,.18);color:#ffd27a;}
.badge-red{background:rgba(244,66,106,.18);color:#ff9db4;}

#main-wrap{flex:1;min-width:0;padding-bottom:40px;}
#topbar{position:sticky;top:0;z-index:35;display:flex;justify-content:flex-end;padding:12px 20px 0;}
#topbar:empty{display:none;}
#topbar select{width:auto;background:rgba(21,21,29,.9);backdrop-filter:blur(8px);border:1px solid rgba(147,112,255,.3);padding:7px 10px;font-size:12.5px;border-radius:10px;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);}
main{max-width:1920px;margin:0 auto;padding:18px 16px 0;}
.grad-heading{font-weight:700 !important;background:linear-gradient(90deg,#c9c4ff,#ffb7e0);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* scouting */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
.filter-bar .input{width:auto;min-width:170px;flex:1 1 170px;max-width:260px;}
.filter-bar select{width:auto;}
.columns-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:900px){.columns-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1500px){.columns-grid{grid-template-columns:repeat(4,1fr);}}
.column{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--dimmer);border-radius:16px;padding:12px;transition:.2s;}
.column.dead{opacity:.85;}
.column-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
.column-title{font-weight:600;font-size:13px;color:#e2e2ea;}
.column-empty{font-size:12px;color:var(--dimmer);font-style:italic;padding:2px 4px;}
.card-list{display:flex;flex-direction:column;gap:10px;min-height:50px;}
.column .card-list{display:grid;grid-template-columns:1fr;align-items:stretch;}
@media(min-width:900px){.column .card-list{grid-template-columns:repeat(2,1fr);}}

.col-uncontacted{border-left-color:var(--dimmer);}
.col-contacted{border-left-color:var(--cyan);}
.col-interested{border-left-color:var(--amber);}
.col-not-interested{border-left-color:var(--red);}
.col-discovered{border-left-color:var(--dimmer);}
.col-attended-event{border-left-color:var(--cyan);}
.col-interview{border-left-color:var(--violet);}
.col-invite-only{border-left-color:var(--indigo2);}
.col-bid-extended{border-left-color:var(--amber);}
.col-bid-accepted{border-left-color:var(--green);}
.col-dropped{border-left-color:var(--red);}

.p-card{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;transition:.18s;cursor:pointer;}
.p-card:hover{border-color:var(--indigo2);transform:translateY(-2px);box-shadow:0 10px 26px -12px rgba(91,82,240,.6);}
.p-card.dead{opacity:.6;}
.p-card.dead:hover{transform:none;box-shadow:none;border-color:var(--border);}
.p-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.p-card-id{display:flex;align-items:center;gap:8px;min-width:0;}
.avatar{width:30px;height:30px;flex-shrink:0;border-radius:999px;background:linear-gradient(135deg,rgba(139,127,255,.35),rgba(236,72,153,.35));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#f1f0ff;}
.p-name{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-ig{font-size:11px;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;display:inline-block;}
.p-ig:hover{text-decoration:underline;}
.p-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.p-vouch{font-size:11px;color:var(--dimmer);margin-top:6px;}
.p-vouch span{color:#d3d3de;}
.p-details{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;font-size:12px;color:var(--dim);}
.p-details p{white-space:pre-wrap;margin:0 0 6px;}
.p-details .row{margin-bottom:4px;}
.p-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;}
@media(min-width:1500px){
  .p-card{padding:9px;}
  .p-actions .btn{padding:5px 8px;font-size:11.5px;}
}

/* rush tracker */
.quick-log-btn{position:sticky;top:66px;z-index:30;width:100%;background:linear-gradient(90deg,var(--indigo),var(--violet) 55%,var(--pink));color:#fff;font-weight:600;font-size:14.5px;padding:13px;border:none;border-radius:16px;cursor:pointer;box-shadow:0 8px 26px -8px rgba(147,51,234,.7);margin-bottom:16px;animation:pulseGlow 3s ease-in-out infinite;}
@media(min-width:900px){.quick-log-btn{top:0;}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 8px 26px -8px rgba(147,51,234,.7);}
  50%{box-shadow:0 8px 32px -6px rgba(236,72,153,.85);}
}
.kanban-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;align-items:flex-start;}
.kanban-col{flex:1 1 165px;min-width:150px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--dimmer);border-radius:16px;padding:10px;transition:outline .1s;}
.kanban-col.drop-hover{outline:2px dashed var(--indigo2);outline-offset:-4px;}
.k-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:grab;transition:.18s;}
.k-card:hover{border-color:var(--indigo2);transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(91,82,240,.6);}
.k-delete{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--dimmer);font-size:12.5px;line-height:1;cursor:pointer;padding:4px 5px;border-radius:7px;transition:.15s;}
.k-delete:hover{color:#fff;background:rgba(244,66,106,.35);}
.k-card.dragging{opacity:.35;}
.k-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-right:20px;}
.k-name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.k-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}

.star-row{display:inline-flex;gap:1px;}
.star{background:none;border:none;padding:0;line-height:1;font-size:16px;color:#3f3f52;cursor:pointer;transition:.1s;}
.star.filled{color:#ffc94a;text-shadow:0 0 8px rgba(255,201,74,.5);}
.star.static{cursor:default;}
.star-sm{font-size:12px;}

/* modal */
.modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(6,6,10,.75);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;}
.modal{background:var(--panel);border:1px solid rgba(147,112,255,.22);border-radius:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 90px -20px rgba(91,51,234,.5);}
.modal.wide{max-width:760px;}
.modal-header{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border);z-index:2;}
.modal-header h3{margin:0;font-size:16px;font-weight:600;}
.modal-close{background:none;border:none;color:var(--dimmer);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 20px;}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 14px;}
@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr;}}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;}
.modal-footer.between{justify-content:space-between;}
.section-divider{border-top:1px solid var(--border);margin:14px 0;padding-top:14px;}
.section-title{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
.mini-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:130px;overflow-y:auto;}
.note-item{background:rgba(255,255,255,.045);border-radius:9px;padding:7px 10px;font-size:13px;}
.note-meta{font-size:10px;color:var(--dimmer);margin-top:3px;}
.inline-add{display:flex;gap:8px;}
.empty-note{font-size:12px;color:var(--dimmer);font-style:italic;}
.mode-toggle{display:flex;gap:8px;margin-bottom:12px;}
.mode-toggle button{flex:1;padding:7px;border-radius:10px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:rgba(255,255,255,.055);color:var(--dim);}
.mode-toggle button.active{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;}

/* deliberations */
.split-pane{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:860px){.split-pane{grid-template-columns:270px 1fr;}}
.pnm-list{display:flex;flex-direction:column;gap:8px;}
@media(min-width:860px){.pnm-list{max-height:72vh;overflow-y:auto;padding-right:4px;}}
.pnm-list-item{text-align:left;width:100%;padding:9px 11px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font:inherit;color:inherit;transition:.15s;}
.pnm-list-item:hover{border-color:var(--indigo2);}
.pnm-list-item.selected{background:linear-gradient(135deg,rgba(91,82,240,.2),rgba(236,72,153,.12));border-color:var(--indigo2);}
.pnm-list-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pnm-list-meta{font-size:11px;color:var(--dimmer);margin-top:4px;}
.dossier{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:20px;}
.dossier-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.avatar-lg{width:54px;height:54px;border-radius:999px;background:linear-gradient(135deg,rgba(139,127,255,.4),rgba(236,72,153,.4));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.dossier-name{font-size:19px;font-weight:600;}
.dossier-sub{font-size:13px;color:var(--dimmer);}
.dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px;margin-bottom:14px;}
.dossier-grid .k{color:var(--dimmer);}
.vote-row{display:flex;gap:8px;margin-bottom:10px;}
.vote-btn{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:13px;border:none;cursor:pointer;background:rgba(255,255,255,.055);transition:.15s;}
.vote-btn.yes{color:#7cf2c4;} .vote-btn.yes.active{background:var(--green);color:#04140d;}
.vote-btn.discuss{color:#ffd27a;} .vote-btn.discuss.active{background:var(--amber);color:#241a02;}
.vote-btn.no{color:#ff9db4;} .vote-btn.no.active{background:var(--red);color:#210505;}
.vote-bar{height:12px;border-radius:999px;overflow:hidden;display:flex;background:rgba(255,255,255,.08);}
.vote-seg-yes{background:var(--green);} .vote-seg-discuss{background:var(--amber);} .vote-seg-no{background:var(--red);}
.vote-meta{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;}
.vote-meta .y{color:#7cf2c4;} .vote-meta .d{color:#ffd27a;} .vote-meta .n{color:#ff9db4;}
.vote-total{font-size:11px;color:var(--dimmer);margin-top:4px;}
.voter-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#ffd27a;font-size:12px;border-radius:10px;padding:9px 12px;margin-bottom:14px;}
.showall-label{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;}

/* roster */
.roster-wrap{max-width:420px;}
.roster-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;}
.roster-hint{font-size:12px;color:var(--dimmer);margin-bottom:14px;}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);z-index:100;padding:10px 18px;border-radius:12px;color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.toast-info{background:linear-gradient(135deg,var(--indigo),var(--violet));}
#toast.toast-success{background:linear-gradient(135deg,#0d9488,var(--green));}
#toast.toast-error{background:linear-gradient(135deg,#dc2626,var(--red));}

.empty-state{font-size:13px;color:var(--dimmer);font-style:italic;padding:8px 2px;}

/* auth gate */
#gate-root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid rgba(147,112,255,.22);border-radius:18px;padding:26px 24px;box-shadow:0 30px 90px -20px rgba(91,51,234,.5);}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.auth-error{background:rgba(244,66,106,.12);border:1px solid rgba(244,66,106,.3);color:#ff9db4;font-size:12.5px;border-radius:10px;padding:9px 12px;margin-bottom:12px;}
.auth-toggle{text-align:center;font-size:12.5px;color:var(--dim);margin-top:14px;}
.auth-toggle button{background:none;border:none;color:var(--indigo2);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0;}
.pending-card{width:100%;max-width:420px;background:var(--panel);border:1px solid rgba(245,158,11,.3);border-radius:18px;padding:28px 24px;text-align:center;}
.role-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(139,127,255,.18);color:#c3bbff;margin-left:6px;}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(21,21,29,.9);backdrop-filter:blur(8px);border:1px solid rgba(147,112,255,.3);padding:6px 12px;border-radius:12px;font-size:12.5px;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);}
.approve-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
</style>
</head>
<body>
<div id="gate-root"></div>
<div id="app-shell" class="hidden">
  <aside id="sidebar"></aside>
  <div id="main-wrap">
    <div id="topbar"></div>
    <main id="tab-content"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* =================================================================
   Constants & tiny helpers
================================================================= */
var OUTREACH_STATUSES = ["Uncontacted", "Contacted", "Interested"];

/* =================================================================

================================================================= */
function el(tag, props) {
  var node = document.createElement(tag);
  var children = Array.prototype.slice.call(arguments, 2);
  if (props) {
    for (var k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
      var v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "style" && typeof v === "object") { for (var s in v) node.style[s] = v[s]; }
      else if (k === "html") node.innerHTML = v;
      else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") node[k] = v;
      else node.setAttribute(k, v === true ? "" : v);
    }
  }
  function append(child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(append); return; }
    if (typeof child === "string" || typeof child === "number") node.appendChild(document.createTextNode(String(child)));
    else if (child instanceof Node) node.appendChild(child);
  }
  children.forEach(append);
  return node;
}
function clearNode(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function mount(container) {
  clearNode(container);
  function append(c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(append); return; }
    container.appendChild(c);
  }
  Array.prototype.slice.call(arguments, 1).forEach(append);
}

/* =================================================================
   Persistence layer — everyone's browser reads/writes the same
   single row in Supabase (table: app_data, id = 1, column: data jsonb).
   Every mutation re-fetches the freshest copy right before writing,
   so two brothers editing at the same moment don't silently clobber
   each other's *other* changes (each function only ever touches the
   one record/field it cares about).
================================================================= */
function defaultData() { return { prospects: [], pnms: [] }; }
function migrateData(d) {
  (d.prospects || []).forEach(function (p) {
    if (p.outreachStatus === "Warm Response") p.outreachStatus = "Interested";
  });
  return d;
}
async function fetchAppData() {
  var res = await sb.from("app_data").select("data").eq("id", 1).single();
  if (res.error) { console.error("RushPulse: failed to load data", res.error); return defaultData(); }
  var d = defaultData();
  var parsed = res.data && res.data.data ? res.data.data : {};
  for (var k in d) if (parsed[k] !== undefined) d[k] = parsed[k];
  return migrateData(d);
}
async function saveAppData(data) {
  var res = await sb.from("app_data").update({
    data: data, updated_at: new Date().toISOString(),
    updated_by: state.session ? state.session.user.id : null
  }).eq("id", 1);
  if (res.error) { console.error("RushPulse: failed to save data", res.error); throw res.error; }
}
// Fetch the freshest remote copy, let `mutator` change it in place, save it,
// then sync local state to match so the UI re-render reflects the save.
async function withData(mutator) {
  try {
    var fresh = await fetchAppData();
    var result = mutator(fresh) || fresh;
    await saveAppData(result);
    state.data = result;
    return result;
  } catch (e) {
    console.error("RushPulse: save failed", e);
    showToast("Save failed — check your connection", "error");
    return null;
  }
}

async function addProspect(fields) {
  var p = {
    id: uid(), name: "", phone: "", email: "", instagram: "", hometown: "", highSchool: "",
    major: "", classYear: "", vouchedBy: "", outreachStatus: "Uncontacted", notes: "",
    jewish: "TBD", legacy: "TBD", connections: "",
    createdAt: today(), promotedToPnm: null
  };
  for (var k in fields) p[k] = fields[k];
  var saved = await withData(function (d) { d.prospects.unshift(p); });
  if (!saved) return false;
  showToast("Added " + p.name + " to Scouting", "success");
  return true;
}
async function editProspect(id, patch) {
  await withData(function (d) {
    var p = d.prospects.find(function (x) { return x.id === id; });
    if (!p) return;
    for (var k in patch) p[k] = patch[k];
  });
}
async function deleteProspect(id) {
  await withData(function (d) { d.prospects = d.prospects.filter(function (p) { return p.id !== id; }); });
}
async function promoteToPNM(prospectId) {
  var fresh = await fetchAppData();
  var p = fresh.prospects.find(function (x) { return x.id === prospectId; });
  if (!p) return;
  var pnm = {
    id: uid(), name: p.name, phone: p.phone, email: p.email, instagram: p.instagram,
    hometown: p.hometown, highSchool: p.highSchool, major: p.major, classYear: p.classYear,
    vouchedBy: p.vouchedBy, jewish: p.jewish || "TBD", legacy: p.legacy || "TBD", connections: p.connections || "", vibeRating: 0, stage: "Discovered",
    eventsAttended: [], notes: p.notes ? [{ id: uid(), author: p.vouchedBy || "Scouting", text: p.notes, date: today() }] : [],
    votes: {}, promotedFromProspectId: p.id, createdAt: p.createdAt, promotedAt: today()
  };
  fresh.pnms.unshift(pnm);
  p.promotedToPnm = pnm.id;

function exportJSON() {
  var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "rushpulse-backup-" + today() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importJSON(file) {
  var reader = new FileReader();
  reader.onload = async function () {
    try {
      var parsed = JSON.parse(reader.result);
      var d = defaultData();
      for (var k in d) if (parsed[k] !== undefined) d[k] = parsed[k];
      var merged = migrateData(d);
      await saveAppData(merged);
      state.data = merged;
      renderApp();
      showToast("Data imported", "success");
    } catch (e) { showToast("Import failed — invalid file", "error"); }
  };
  reader.readAsText(file);
}

function fillFilterOptions(hometownSel, schoolSel, majorSel) {
  var active = state.data.prospects.filter(function (p) { return !p.promotedToPnm; });
  function uniq(arr) {
    var seen = {}; var out = [];
    arr.forEach(function (v) { if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    return out.sort();
  }
  var hometowns = uniq(active.map(function (p) { return p.hometown; }));
  var schools = uniq(active.map(function (p) { return p.highSchool; }));
  var majors = uniq(active.map(function (p) { return p.major; }));
  mount(hometownSel, el("option", { value: "" }, "All hometowns"), hometowns.map(function (h) { return el("option", { value: h, selected: state.scoutingHometown === h }, h); }));
  mount(schoolSel, el("option", { value: "" }, "All high schools"), schools.map(function (h) { return el("option", { value: h, selected: state.scoutingSchool === h }, h); }));
  mount(majorSel, el("option", { value: "" }, "All majors"), majors.map(function (h) { return el("option", { value: h, selected: state.scoutingMajor === h }, h); }));
}
function refreshScoutingColumns() {

function fillScoutingColumns(container) {
  clearNode(container);
  var active = state.data.prospects.filter(function (p) { return !p.promotedToPnm; });
  var search = state.scoutingSearch.toLowerCase();
  var filtered = active.filter(function (p) {
    var matchesSearch = !search || p.name.toLowerCase().indexOf(search) !== -1 || normalizeIG(p.instagram).indexOf(search) !== -1;
    return matchesSearch &&

      discussBtn.className = "vote-btn discuss" + (selected.votes[voterName] === "discuss" ? " active" : "");
      noBtn.className = "vote-btn no" + (selected.votes[voterName] === "no" ? " active" : "");
      clearNode(voteBarWrap); voteBarWrap.appendChild(buildVoteBar(selected));
    }
    function vote(choice) { selected.votes[voterName] = choice; castVote(selected.id, voterName, choice); refreshVoteRow(); refreshListMeta(); }
    yesBtn.addEventListener("click", function () { vote("yes"); });
    discussBtn.addEventListener("click", function () { vote("discuss"); });
    noBtn.addEventListener("click", function () { vote("no"); });
    function refreshListMeta() { renderTabContent(); }

    dossierCol.appendChild(el("div", { class: "dossier-head" },
      el("div", { class: "avatar-lg" }, initials(selected.name)),
      el("div", { style: { flex: 1 } },
        el("div", { class: "dossier-name" }, selected.name),
        el("div", { class: "dossier-sub" }, (selected.major || "—") + (selected.classYear ? " · Class of " + selected.classYear : "")),
        el("div", { style: { marginTop: "4px" } }, starsWrap)
      ),
      badge(selected.stage, "indigo")
    ));
    dossierCol.appendChild(el("div", { class: "dossier-grid" },
      el("div", {}, el("span", { class: "k" }, "Hometown: "), selected.hometown || "—"),
      el("div", {}, el("span", { class: "k" }, "High School: "), selected.highSchool || "—"),
      el("div", {}, el("span", { class: "k" }, "Vouched by: "), selected.vouchedBy || "—"),
      el("div", {}, el("span", { class: "k" }, "Events: "), String(selected.eventsAttended.length)),
      el("div", {}, el("span", { class: "k" }, "Instagram: "), igLink(selected.instagram) || "—"),
      el("div", {}, el("span", { class: "k" }, "Connections: "), selected.connections || "—")
    ));
    dossierCol.appendChild(el("div", { class: "section-divider" },
      el("div", { class: "section-title" }, "Notes Timeline"),
      notesList,
      el("div", { class: "inline-add" }, noteI, addNoteBtn)
    ));
    dossierCol.appendChild(el("div", { class: "section-divider" },
      el("div", { class: "section-title" }, "Cast Your Vote"),
      el("div", { class: "vote-row" }, yesBtn, discussBtn, noBtn),
      voteBarWrap
    ));
  }

  wrap.appendChild(el("div", { class: "split-pane" }, listCol, dossierCol));
  return wrap;
}

/* =================================================================
   Team tab — approved brothers list, plus admin approval panel
================================================================= */
function renderTeam() {
  var isAdmin = state.profile && state.profile.role === "admin";
  var wrap = el("div", { class: "roster-wrap" });

  if (isAdmin) {
    wrap.appendChild(el("h2", { class: "grad-heading", style: { marginBottom: "4px", fontSize: "16px" } }, "Pending Requests"));
    wrap.appendChild(el("div", { class: "roster-hint" }, "New signups land here until you approve them — nobody can see PNM data until you do."));
    var pendingList = el("div", { style: { marginBottom: "22px" } });
    if (state.pendingProfiles.length === 0) {
      pendingList.appendChild(el("div", { class: "empty-state" }, "No pending requests"));
    } else {
      state.pendingProfiles.forEach(function (p) {
        pendingList.appendChild(el("div", { class: "approve-row" },
          el("span", { style: { fontSize: "13px" } }, p.name),
          el("div", { style: { display: "flex", gap: "6px" } },
            el("button", { class: "btn btn-primary btn-sm", onclick: function () { approveProfile(p.id, "brother"); } }, "Approve"),
            el("button", { class: "btn btn-ghost btn-sm", onclick: function () { approveProfile(p.id, "admin"); } }, "Make Admin")
          )
        ));
      });
    }
    wrap.appendChild(pendingList);
  }

  wrap.appendChild(el("h2", { class: "grad-heading", style: { marginBottom: "4px", fontSize: "16px" } }, "Active Chapter Roster"));
  wrap.appendChild(el("div", { class: "roster-hint" }, 'Everyone here can add/edit PNMs and vote. Used for "Vouched By" and the vote % baseline in Deliberations.'));
  var list = el("div", {});
  if (state.approvedProfiles.length === 0) list.appendChild(el("div", { class: "empty-state" }, "No approved brothers yet"));
  state.approvedProfiles.forEach(function (b) {
    list.appendChild(el("div", { class: "roster-row" },
      el("span", { style: { fontSize: "13px" } }, b.name, b.role === "admin" ? el("span", { class: "role-pill" }, "Admin") : null),
      isAdmin && b.id !== state.profile.id
        ? el("button", { class: "btn-xs", style: { color: "#fca5a5" }, onclick: function () { approveProfile(b.id, "pending"); } }, "Revoke")
        : null
    ));
  });
  wrap.appendChild(list);
  return wrap;
}

/* =================================================================
   Auth gate — login/signup and pending-approval screens
================================================================= */
function renderGate() {
  var root = document.getElementById("gate-root");
  var content;
  if (state.authView === "signup") {
    var nameI = el("input", { class: "input", placeholder: "Full name", required: true });
    var emailI = el("input", { class: "input", type: "email", placeholder: "Email", required: true });
    var passI = el("input", { class: "input", type: "password", placeholder: "Password (6+ characters)", required: true });
    content = el("div", { class: "auth-card" },
      el("div", { class: "auth-brand" },
        el("div", { class: "brand-logo", html: PULSE_ICON }),
        el("div", { class: "brand-name" }, "RushPulse")
      ),
      state.authError ? el("div", { class: "auth-error" }, state.authError) : null,
      field("Name", nameI), field("Email", emailI), field("Password", passI),
      el("button", {
        class: "btn btn-primary", style: { width: "100%", padding: "11px" },
        onclick: function () { if (nameI.value.trim() && emailI.value.trim() && passI.value) signUp(nameI.value.trim(), emailI.value.trim(), passI.value); }
      }, "Create Account"),
      el("div", { class: "auth-toggle" }, "Already have an account? ",
        el("button", { onclick: function () { state.authView = "login"; state.authError = ""; renderGate(); } }, "Log in"))
    );
  } else {
    var emailI2 = el("input", { class: "input", type: "email", placeholder: "Email", required: true });
    var passI2 = el("input", { class: "input", type: "password", placeholder: "Password", required: true });
    content = el("div", { class: "auth-card" },
      el("div", { class: "auth-brand" },
        el("div", { class: "brand-logo", html: PULSE_ICON }),
        el("div", { class: "brand-name" }, "RushPulse")
      ),
      state.authError ? el("div", { class: "auth-error" }, state.authError) : null,
      field("Email", emailI2), field("Password", passI2),
      el("button", {
        class: "btn btn-primary", style: { width: "100%", padding: "11px" },
        onclick: function () { if (emailI2.value.trim() && passI2.value) signIn(emailI2.value.trim(), passI2.value); }
      }, "Log In"),
      el("div", { class: "auth-toggle" }, "New here? ",
        el("button", { onclick: function () { state.authView = "signup"; state.authError = ""; renderGate(); } }, "Create an account"))
    );
  }
  mount(root, content);
}
function renderPendingGate() {
  var root = document.getElementById("gate-root");
  mount(root, el("div", { class: "pending-card" },
    el("div", { class: "brand-logo", html: PULSE_ICON, style: { margin: "0 auto 14px" } }),
    el("h3", { style: { margin: "0 0 8px" } }, "Waiting for approval"),
    el("p", { style: { color: "var(--dimmer)", fontSize: "13px", margin: "0 0 18px" } },
      "Your account is created — an admin (your Rush Chair) needs to approve you before you can see or edit anything."),
    el("button", { class: "btn btn-ghost", onclick: function () { signOut(); } }, "Sign out")
  ));
}

/* =================================================================
   Render orchestration
================================================================= */
function renderTabContent() {
  var root = document.getElementById("tab-content");
  clearNode(root);
  if (state.tab === "scouting") root.appendChild(renderScouting());
  else if (state.tab === "tracker") root.appendChild(renderTracker());
  else if (state.tab === "deliberations") root.appendChild(renderDeliberations());
  else if (state.tab === "team") root.appendChild(renderTeam());
}
function renderApp() {
  renderHeader();
  renderTabContent();
}
function showGateRoot() {
  document.getElementById("gate-root").classList.remove("hidden");
  document.getElementById("app-shell").classList.add("hidden");
}
function showApp() {
  document.getElementById("gate-root").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
}

var realtimeSubscribed = false;
function subscribeRealtime() {
  if (realtimeSubscribed || !sb) return;
  realtimeSubscribed = true;
  sb.channel("app_data_changes")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "app_data" }, function (payload) {
      if (payload.new && payload.new.data) { state.data = migrateData(payload.new.data); renderTabContent(); }
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, function () {
      fetchProfileLists().then(function () { renderHeader(); renderTabContent(); });
    })
    .subscribe();
}

/* =================================================================
   Boot
================================================================= */
async function boot() {
  if (!sb) {
    document.getElementById("gate-root").innerHTML =
      '<div class="auth-card"><h3 style="margin-top:0">Setup needed</h3>' +
      '<p style="color:var(--dimmer);font-size:13px">This copy of RushPulse isn\'t connected to a database yet — paste your Supabase Project URL and anon key into the SUPABASE_URL / SUPABASE_ANON_KEY constants near the top of the script.</p></div>';
    showGateRoot();
    return;
  }
  var sessionRes = await sb.auth.getSession();
  state.session = sessionRes.data ? sessionRes.data.session : null;
  if (!state.session) {
    state.profile = null;
    renderGate();
    showGateRoot();
    return;
  }
  state.profile = await fetchProfile(state.session.user.id);
  if (!state.profile || state.profile.role === "pending") {
    renderPendingGate();
    showGateRoot();
    return;
  }
  await fetchProfileLists();
  state.data = await fetchAppData();
  subscribeRealtime();
  showApp();
  renderApp();
}

boot();
</script>
</body>
</html>
